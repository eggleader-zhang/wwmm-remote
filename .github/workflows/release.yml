name: Release desktop packages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/releases/*.md'
      - '.github/workflows/release.yml'
      - 'scripts/release_*.py'
      - 'CMakeLists.txt'
      - 'cmake/*.cmake'
      - 'src/**'
      - 'platform/**'
      - 'installer/**'

concurrency:
  group: desktop-releases
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      number: ${{ steps.version.outputs.number }}
      tag: ${{ steps.version.outputs.tag }}
      pending: ${{ steps.version.outputs.pending }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          number=$(sed -nE 's/^project\(WWMMRemote VERSION ([0-9]+\.[0-9]+\.[0-9]+) .*/\1/p' CMakeLists.txt)
          test -n "$number"
          echo "number=$number" >> "$GITHUB_OUTPUT"
          tag=$(for note in "docs/releases/v$number.md" "docs/releases/v$number"-r[0-9]*.md; do
            if [[ -s "$note" ]]; then basename "$note" .md; fi
          done | sort -V | tail -1)
          if [[ -z "$tag" ]]; then
            echo "No release notes for v$number." >> "$GITHUB_STEP_SUMMARY"
            if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then exit 1; fi
            exit 0
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          published=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
            jq -r --arg tag "$tag" '.[] | select(.tag_name == $tag and .draft == false) | .id')
          if [[ -z "$published" ]]; then
            echo "pending=true" >> "$GITHUB_OUTPUT"
          else
            echo "$tag is already published." >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    needs: version
    if: needs.version.outputs.pending == 'true'
    name: Build ${{ needs.version.outputs.tag }} · ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            runner: macos-26
          - target: macos-x86_64
            runner: macos-26-intel
          - target: windows-x64
            runner: windows-2022
            msvc: x64
          - target: windows-arm64
            runner: windows-11-arm
            msvc: arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.x'
          cache-dependency-path: installer/update/go.sum
      - name: Build and package macOS
        if: runner.os == 'macOS'
        run: python3 scripts/release_package.py "${{ matrix.target }}"
      - name: Build and package Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%v in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do set "vs=%%v"
          call "%vs%\Common7\Tools\VsDevCmd.bat" -no_logo -arch=${{ matrix.msvc }} -host_arch=${{ matrix.msvc }}
          if errorlevel 1 exit /b 1
          python scripts\release_package.py "${{ matrix.target }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-${{ matrix.target }}
          path: dist/${{ needs.version.outputs.number }}/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  installers:
    needs: [version, build]
    name: Assemble ${{ matrix.os }} installer
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: darwin, prefix: macos, runner: macos-26 }
          - { os: windows, prefix: windows, runner: windows-2022 }
    env:
      VERSION: ${{ needs.version.outputs.number }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: native-${{ matrix.prefix }}-*
          path: packages
          merge-multiple: true
      - name: Assemble universal Mac app
        if: runner.os == 'macOS'
        env: &apple_signing
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: python3 scripts/release_installers.py prepare darwin "$VERSION"
      - name: Assemble native Windows payloads
        if: runner.os == 'Windows'
        env: &windows_signing
          WINDOWS_CERTIFICATE_PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: python scripts/release_installers.py prepare windows $env:VERSION
      - name: Sign offline update manifest with this workflow identity
        id: provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: build-installer/release.json
      - name: Create Mac disk image
        if: runner.os == 'macOS'
        env: *apple_signing
        run: python3 scripts/release_installers.py finish darwin "$VERSION" --bundle "${{ steps.provenance.outputs.bundle-path }}"
      - name: Create Windows setup EXE
        if: runner.os == 'Windows'
        shell: cmd
        env: *windows_signing
        run: |
          for /f "usebackq tokens=*" %%v in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do set "vs=%%v"
          call "%vs%\Common7\Tools\VsDevCmd.bat" -no_logo -arch=x86 -host_arch=x64
          if errorlevel 1 exit /b 1
          python scripts\release_installers.py finish windows "%VERSION%" --bundle "${{ steps.provenance.outputs.bundle-path }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installer-${{ matrix.os }}
          path: dist/installers/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    needs: [version, installers]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: installer-*
          path: packages
          merge-multiple: true
      - name: Publish the installers
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: python3 scripts/release_publish.py
